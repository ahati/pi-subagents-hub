name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # The peer dependency floor is 1.6.1 — the API baseline the extension targets
  # (readonly render output, pi-durable 1.6.1's tagged ToolPark) — while the dev
  # baseline is the current pi, so this job pins the whole family at the floor.
  # pi-agent-core, pi-durable and chord are pinned alongside the other three so
  # the floor tree stays single-version: a mixed top-level/nested pi-agent-core
  # splits branded types (AgentMessage, AgentSession) across copies, and
  # pi-durable pins pi-ai exactly, so one left at the lock's version nests a
  # second pi-ai whose types do not structurally match. Both fail falsely. Keep
  # this job strict so the advertised minimum remains an executable promise.
  compat-floor-pi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install floor Pi
        run: npm install --no-save @earendil-works/pi-coding-agent@1.6.1 @earendil-works/pi-agent-core@1.6.1 @earendil-works/pi-ai@1.6.1 @earendil-works/pi-tui@1.6.1 @earendil-works/pi-durable@1.6.1 @earendil-works/chord@1.6.1
      - name: Typecheck against floor Pi
        run: npm run typecheck
      - name: Test suite against floor Pi
        run: npx vitest run --reporter=dot

  # Forward canary: reinstall whatever Pi is `latest` over the locked Pi, so a release
  # newer than the tested baseline surfaces here before it reaches users. It runs the full
  # typecheck + suite, not a hand-picked file list, so new drift can't hide in a test nobody
  # remembered to add here. This remains a non-blocking canary.
  compat-latest-pi:
    runs-on: ubuntu-24.04
    continue-on-error: true # current Pi is not a hard support guarantee; surface breakage without blocking
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Pi packages must move together: pi-durable pins its pi-ai/chord
      # dependencies exactly, so updating only the top-level three leaves a
      # second pi-ai copy whose types do not structurally match (Models,
      # TranscriptContext).
      - name: Install current Pi
        run: npm install --no-save @earendil-works/pi-coding-agent@latest @earendil-works/pi-ai@latest @earendil-works/pi-tui@latest @earendil-works/pi-durable@latest @earendil-works/chord@latest @earendil-works/pi-agent-core@latest
      - name: Typecheck against current Pi
        run: npm run typecheck
      - name: Test suite against current Pi
        run: npx vitest run --reporter=dot
