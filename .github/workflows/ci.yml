name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # The extension uses the 1.5.0 Pi API baseline throughout its session, model
  # registry, tool and prompt integration. Pi 1.1.0 passes some surface types but
  # does not satisfy the runtime contract exercised by the suite: agent tools,
  # model selection and prompt/resource loading fail across the integration tests.
  # The peer dependency floor is therefore 1.5.0, matching the tested dev baseline.
  # Keep this job strict so the advertised minimum remains an executable promise.
  compat-floor-pi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install floor Pi
        run: npm install --no-save @earendil-works/pi-coding-agent@1.5.0 @earendil-works/pi-ai@1.5.0 @earendil-works/pi-tui@1.5.0
      - name: Typecheck against floor Pi
        run: npm run typecheck
      - name: Test suite against floor Pi
        run: npx vitest run --reporter=dot

  # Forward canary: reinstall whatever Pi is `latest` over the 1.5.0 pin, so a release
  # newer than the tested baseline surfaces here before it reaches users. It runs the full
  # typecheck + suite, not a hand-picked file list, so new drift can't hide in a test nobody
  # remembered to add here. This remains a non-blocking canary.
  compat-latest-pi:
    runs-on: ubuntu-24.04
    continue-on-error: true # current Pi is not a hard support guarantee; surface breakage without blocking
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install current Pi
        run: npm install --no-save @earendil-works/pi-coding-agent@latest @earendil-works/pi-ai@latest @earendil-works/pi-tui@latest
      - name: Typecheck against current Pi
        run: npm run typecheck
      - name: Test suite against current Pi
        run: npx vitest run --reporter=dot
