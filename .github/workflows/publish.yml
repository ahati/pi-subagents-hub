name: Publish

# Releases are calendar-versioned tags (v2026.10.18-r4). Pushing the tag is the
# publish trigger; prepublishOnly (lint + typecheck + test + build) gates it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm Trusted Publishing: the job's OIDC token is exchanged for a short-lived publish grant, no NPM_TOKEN secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Node 22 bundles npm 10.x; OIDC trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@^11
      - name: Verify tag matches package version
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag v$tag does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm publish --provenance
